    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <title>Xul Solar - Panajedrez</title>
</head>

<body class="bg-light text-dark font-monospace d-flex flex-column min-vh-100">
    <div class="container">

        <header>
            <!-- NAVBAR -->
                <nav class="navbar navbar-expand-md border-bottom">
                    <div class="container-fluid">
                        <a class="navbar-brand fw-bold" href="index.html" title="PANMUND">XUL SOLAR // INICIO</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                        <span class="navbar-toggler-icon"></span>
                    </button>

                        <div class="collapse navbar-collapse" id="menu">
                            <div class="navbar-nav ms-auto">
                                <a class="nav-link" href="bio.html" title="VIDAVITA">BIO</a>
                                <a class="nav-link" href="panlengua.html" title="PANLENG">PANLENGUA</a>
                                <a class="nav-link" href="panajedrez-v2.0.html" title="PANXAD">PANAJEDREZ</a>
                                <a class="nav-link" href="vanguardia.html" title="NUEVART">VANGUARDIA</a>
                            </div>
                         </div>
                    </div>
                </nav>

        </header>

        <main class="container-fluid">

        <!-- PANEL GENERAL -->
            <div id="panel"> <!-- SE OCULTA TODO PARA MOSTRAR LA CONSTELACIÓN -->

                <h1 class="text-center mb-4 mt-4">PANAJEDREZ</h1>
                
                <div class="row">

                    <!-- columna 1 -->
                    <div class="col-12 col-md-9">

                        <!-- FICHAS -->
                            <div class="card p-1 mb-1 d-flex justify-content-center align-items-center">
                                <h2 class="card-title text-center mb-0">Fichas</h2>
                                <div id="fichas" class="card-body"></div>            
                            </div>


                        <!-- TABLERO -->
                            <div class="card p-3 mb-3">
                                <!-- <h2 class="card-title text-center">Tablero</h2> -->
                                 <div id="contenedorTablero" class="card-body">
                                    <div class="d-flex flex-row">
                                        <div class="col-1 d-flex"></div>
                                        <div id="ejeHorizontal" class="col-11 d-flex flex-md-row justify-content-around mb-2"></div>
                                    </div>

                                    <div id="zonaTablero" class="d-flex">
                                        <div id="ejeVertical" class="d-flex flex-column justify-content-around me-2"></div>
                                        <div id="tablero" class="row g-1"></div>
                                    </div>
                                </div>
                            </div>
                    </div>


                    <!-- columna 2 -->
                    <div class="col-12 col-md-3">
                        
                        <!-- VISOR DE SIGNOS -->
                            <div class="card p-3 mb-3 h-33">
                                <h2 class="card-title text-center">Signo</h2>
                                <div class="card-body">
                                    <p id="signoActual" class="h5 mb-3"></p>
                                    <button id="btnCerrar" class="btn btn-secondary">Crear Signo</button>
                                </div>
                            </div>


                        <!-- VISOR POEMA -->
                            <div class="card p-3 mb-3 h-33">
                                <div id="poema" class="card p-3 mb-3">
                                    <h2 class="card-title text-center">Poema</h2>
                                    <div id="obra" class="card-body"></div>
                                </div>
                            </div>


                            <!-- BOTON REVELAR OBRA -->
                            <div class="card p-3 mb-3 h-33">
                                <div class="text-center">
                                    <button id="btnRevelar" class="btn btn-dark m-3">13<br>Revelar obra</button>
                                </div>
                            </div>
                    </div>
                </div>

            </div>


            <!-- RUEDA CONSTELAR -->
                <div class="row align-items-center">

                <!-- COLUMNA 1 -->
                    <div id="ruedaConstelar" class="rueda col-12 col-md-9">

                        <div class="card p-3 mb-3 mt-5 text-center">
                            <div class="h2 card-title">Constelación</div>

                            <div class="card-body d-flex justify-content-center">
                                <div class="constelacion position-relative">
                                    <svg id="lienzoConstelar" class="position-absolute"></svg>
                                    <div id="nodos"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card p-3 m-3">
                            <button id="btnRecrear" class="btn btn-light">
                                Recrear Cosmos
                            </button>
                        </div>

                    </div>

                <!-- COLUMNA 2 -->
                    <div id="columnaPoema" class="col-12 col-md-3"></div>

                </div>

            </main>

        <!-- FOOTER -->
            <footer class="d-flex flex-column flex-md-row justify-content-between align-items-center py-3 px-4 border-top border-dark opacity-50 small">
