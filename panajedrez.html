<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    
    <link rel="stylesheet" type="text/css" href="css/estilos-ruedaConstelar.css"> <!-- estilos para CONSTELACIÓN -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <title>Xul Solar - Panajedrez</title>
</head>

<body>
    <div class="container py-4">
        <header>
            <!-- NAVBAR -->
                <nav class="navbar navbar-expand-md border-bottom">
                    <div class="container-fluid">
                        <a class="navbar-brand fw-bold" href="index.html" title="PANMUND">XUL SOLAR // INICIO</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                        <span class="navbar-toggler-icon"></span>
                    </button>

                        <div class="collapse navbar-collapse" id="menu">

                            <div class="navbar-nav ms-auto">
                                <a class="nav-link" href="bio.html" title="VIDAVITA">BIO</a>
                                <a class="nav-link" href="panlengua.html" title="PANLENG">PANLENGUA</a>
                                <a class="nav-link" href="panajedrez-v2.0.html" title="PANXAD">PANAJEDREZ</a>
                                <a class="nav-link" href="vanguardia.html" title="NUEVART">VANGUARDIA</a>
                            </div>
                         </div>
                    </div>
                </nav>

            <h1 class="text-center mb-4 mt-4">PANAJEDREZ</h1>
        </header>

        <main>
        <!-- PANEL GENERAL -->
            <div id="panel"> <!-- SE OCULTA TODO PARA MOSTRAR LA CONSTELACIÓN -->
                
                <div class="row">

                    <!-- FICHAS col 1 -->
                        <div class="col-md-6">
                            <div class="card p-3 mb-3">
                                <h2 class="h5 text-center">fichas Consonante</h2>

                                <select id="consonante" class="form-select">
                                    <option>M</option>
                                    <option>T</option>
                                    <option>S</option>
                                    <option>P</option>
                                    <option>K</option>
                                </select>
                            </div>

                    <!-- TABLERO -->
                            <div class="card p-3 mb-3">
                                <div class="card p-3 mb-3">
                                    <h2 class="h5 text-center">Tablero vocales</h2>

                                     <div id="contenedorTablero">

                                        <div>
                                            <div id="ejeHorizontal" class="d-flex justify-content-around mb-2"></div>
                                        </div>

                                        <div id="zonaTablero" class="d-flex">

                                            <div id="ejeVertical" class="d-flex flex-column justify-content-around me-2"></div>

                                            <div id="tablero" class="row g-2"></div>

                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>

                    <!-- VISOR DE SIGNOS col 2 -->
                        <div class="signo col-md-6 d-flex flex-column">
                            <h2 class="h5 text-center">Signo</h2>
                            <p id="signoActual" class="h5 mb-3"></p>

                            <button id="btnCerrar" class="btn btn-secondary">Cerrar signo</button>
                        </div>
                </div>


                <!-- BOTON EXPONER col 4 -->
                    <div class="row">
                        <div class="text-center">
                            <button id="btnRevelar" class="btn btn-dark m-3">
                                13
                                <br>
                                Revelar obra
                            </button>
                        </div>
                    </div>
            </div>


            <!-- RUEDA CONSTELAR -->
                <div id="ruedaConstelar" class="rueda row p-3 mb-3">
                    <h2 class="h5 text-center">Constelación</h2>

                <!-- LIENZO SVG -->
                    <div class="col-md-9">
                        
                        <svg id="lienzoConstelar"></svg>

                        <div id="nodos"></div>
                            
                    </div>
                </div>


            <!-- VISOR OBRA col 3 -->
                <div class="row">
                    <div class="col">
                        <div class="card p-3 mb-3 border-0">
                            <h2 class="h5 text-center">Poema</h2>
                            <div id="obra"></div>
                        </div>
                    </div>
                </div>

            <!-- BOTON REINICIO -->
                <div class="row">
                    <button id="btnRecrear" class="btn btn-light m-3">Recrear Cosmos</button>
                </div>

        </main>

        <!-- FOOTER -->
            <footer class="d-flex flex-column flex-md-row justify-content-between align-items-center py-3 px-4 border-top border-dark opacity-50 small">
                <p class="m-0">©2026 nosotros.nosotros</p>

                <div class="d-flex gap-3">
                    <a class="nav-link p-0" href="contacto.html">Contacto</a>
                    <a class="nav-link p-0" href="nosotros.html">Nosotros</a>
                </div>
            </footer>
    </div>

    <script src="js/panajedrez.js"></script>

</body>

</html>
